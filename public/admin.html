<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Way2Travels Admin</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="admin-body">
  <section id="loginScreen" class="login-screen">
    <form id="loginForm" class="login-card">
      <a class="brand" href="index.html"><span>Way2</span>Travels</a>
      <h1>Admin Login</h1>
      <input name="email" type="email" placeholder="Email" required>
      <input name="password" type="password" placeholder="Password" required>
      <button class="btn primary" type="submit">Login</button>
      <p class="form-status" data-status></p>
    </form>
  </section>

  <section id="adminApp" class="admin-shell" hidden>
    <aside class="sidebar">
      <a class="brand" href="index.html"><span>Way2</span>Travels</a>
      <nav id="adminNav"></nav>
      <button class="logout" id="logoutButton">Logout</button>
    </aside>
    <main class="admin-main">
      <div id="adminView"></div>
    </main>
  </section>

  <script src="admin.js"></script>
</body>
</html>
